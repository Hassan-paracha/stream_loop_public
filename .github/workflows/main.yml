name: 24/7 Viral Shorts Stream

on:
  schedule:
    # 03:00 UTC = 8:00 AM PKT
    # 11:00 UTC = 4:00 PM PKT
    # 19:00 UTC = 12:00 AM PKT
    - cron: '0 3,11,19 * * *'
  workflow_dispatch: # Manual Trigger

# PREVENTS OVERLAPPING STREAMS
concurrency:
  group: youtube-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # Safety: Kills job if it runs over 5h 20m
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Configure Rclone (Dropbox)
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [db]
          type = dropbox
          token = ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Launch Stream Engine
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python stream.py
