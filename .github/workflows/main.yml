name: YouTube 24/7 Stream

on:
  schedule:
    - cron: '0 3,11,19 * * *' # Starts at 5 AM, 1 PM, and 9 PM Pakistan Time
  workflow_dispatch: # Allows you to start it manually if needed

# SAFETY LOCK: This prevents two streams from running at the same time.
concurrency:
  group: youtube-stream
  cancel-in-progress: true 

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # Hard-stop after 5 hours and 20 mins
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rclone and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone ffmpeg

      - name: Config Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run Stream Engine
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python stream.py
